services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger_password
      POSTGRES_DB: money_ledger_production
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      RAILS_ENV: production
      RAILS_MAX_THREADS: 5
      SECRET_KEY_BASE_DUMMY: "1"
      API_TOKEN: ${API_TOKEN:-recruitment-test-token}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ledger
      DB_PASSWORD: ledger_password
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "bin/rails db:prepare &&
             bin/rails server -b 0.0.0.0 -p 8080"

volumes:
  postgres_data:
